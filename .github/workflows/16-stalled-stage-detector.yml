name: "RW: Detect and Requeue Stalled Issues"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no label changes)"
        required: true
        default: true
        type: boolean
      stale_minutes:
        description: "Minimum minutes since stage label was applied"
        required: true
        default: "30"
      max_issues:
        description: "Max stalled issues to requeue"
        required: true
        default: "25"
      stage_filter:
        description: "Optional exact stage label (e.g. stage/3-scored)"
        required: false
        default: ""
  # schedule:
  #   - cron: "0 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: rw-stalled-stage-detector
  cancel-in-progress: false

jobs:
  detect-and-requeue:
    runs-on: ubuntu-latest
    steps:
      - name: Detect stale stage issues and optionally requeue
        uses: actions/github-script@v8
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INPUT_STALE_MINUTES: ${{ inputs.stale_minutes || '15' }}
          INPUT_MAX_ISSUES: ${{ inputs.max_issues || '15' }}
          INPUT_STAGE_FILTER: ${{ inputs.stage_filter || '' }}
          SAFEOUTPUTS_TOKEN_PRESENT: ${{ secrets.SAFEOUTPUTS_GITHUB_TOKEN != '' }}
        with:
          github-token: ${{ secrets.SAFEOUTPUTS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const isSchedule = context.eventName === 'schedule';
            const dryRunInput = String(process.env.INPUT_DRY_RUN || 'false').toLowerCase() === 'true';
            const dryRun = isSchedule ? false : dryRunInput;

            const staleMinutes = Number.parseFloat(process.env.INPUT_STALE_MINUTES || '15');
            const maxIssues = Number.parseInt(process.env.INPUT_MAX_ISSUES || '15', 10);
            const stageFilter = (process.env.INPUT_STAGE_FILTER || '').trim();
            const safeTokenPresent = String(process.env.SAFEOUTPUTS_TOKEN_PRESENT).toLowerCase() === 'true';

            if (!Number.isFinite(staleMinutes) || staleMinutes <= 0) {
              core.setFailed('stale_minutes must be a positive number.');
              return;
            }

            if (!Number.isInteger(maxIssues) || maxIssues <= 0) {
              core.setFailed('max_issues must be a positive integer.');
              return;
            }

            if (!dryRun && !safeTokenPresent) {
              core.setFailed('SAFEOUTPUTS_GITHUB_TOKEN is required for non-dry-run mode to reliably trigger downstream workflows.');
              return;
            }

            const stageLabelPattern = /^stage\/\d+-/;
            const ignoredLabel = 'agentic-workflows';
            const experimentLabel = 'type/experiment';
            const thresholdMs = staleMinutes * 60 * 1000;
            const nowMs = Date.now();

            async function hasExperimentSubIssue(issueNumber) {
              let subPage = 1;
              while (subPage <= 10) {
                let response;
                try {
                  response = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                    owner,
                    repo,
                    issue_number: issueNumber,
                    per_page: 100,
                    page: subPage
                  });
                } catch (error) {
                  if (error.status === 404 || error.status === 410 || error.status === 422) {
                    return false;
                  }
                  throw error;
                }

                const subIssues = Array.isArray(response.data)
                  ? response.data
                  : Array.isArray(response.data?.sub_issues)
                    ? response.data.sub_issues
                    : [];

                if (subIssues.length === 0) return false;

                for (const subIssue of subIssues) {
                  const labels = (subIssue.labels || [])
                    .map((label) => typeof label === 'string' ? label : label?.name)
                    .filter(Boolean);
                  if (labels.includes(experimentLabel)) return true;
                }

                if (subIssues.length < 100) return false;
                subPage += 1;
              }

              return false;
            }

            let skippedWithExperimentSubIssue = 0;

            const openProblems = [];
            let page = 1;
            while (page <= 10) {
              const response = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: 'type/problem',
                per_page: 100,
                page
              });

              const issues = response.data.filter((item) => !item.pull_request);
              if (issues.length === 0) break;
              openProblems.push(...issues);
              page += 1;
            }

            const candidates = [];
            for (const issue of openProblems) {
              const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name).filter(Boolean);
              if (labels.includes(ignoredLabel)) continue;

              const stageLabels = labels.filter((label) => stageLabelPattern.test(label));
              if (stageLabels.length !== 1) continue;

              const stageLabel = stageLabels[0];
              if (stageLabel === 'stage/9-archived') continue;
              if (stageFilter && stageLabel !== stageFilter) continue;

              if (await hasExperimentSubIssue(issue.number)) {
                skippedWithExperimentSubIssue += 1;
                continue;
              }

              const issueUpdatedMs = new Date(issue.updated_at).getTime();
              if (!Number.isFinite(issueUpdatedMs) || (nowMs - issueUpdatedMs) < thresholdMs) continue;

              const events = await github.paginate(github.rest.issues.listEvents, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100
              });

              const stageAppliedEvents = events
                .filter((event) => event.event === 'labeled' && event.label && event.label.name === stageLabel)
                .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());

              if (stageAppliedEvents.length === 0) continue;

              const stageAppliedMs = new Date(stageAppliedEvents[0].created_at).getTime();
              if (!Number.isFinite(stageAppliedMs)) continue;

              const ageMs = nowMs - stageAppliedMs;
              if (ageMs < thresholdMs) continue;

              candidates.push({
                number: issue.number,
                title: issue.title,
                stageLabel,
                stageAgeHours: Number((ageMs / (60 * 60 * 1000)).toFixed(1)),
                updatedHours: Number(((nowMs - issueUpdatedMs) / (60 * 60 * 1000)).toFixed(1))
              });

              if (candidates.length >= maxIssues) break;
            }

            const results = [];
            for (const item of candidates) {
              if (dryRun) {
                results.push({ ...item, status: 'preview' });
                continue;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: item.number,
                  name: item.stageLabel
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: item.number,
                labels: [item.stageLabel]
              });

              results.push({ ...item, status: 'requeued' });
            }

            const lines = [
              `Event: ${context.eventName}`,
              `Mode: ${dryRun ? 'dry-run' : 'apply'}`,
              `Stale threshold: ${staleMinutes}m`,
              `Eligible stalled issues: ${candidates.length}`,
              `Skipped (has sub-issue with ${experimentLabel}): ${skippedWithExperimentSubIssue}`,
              ''
            ];

            if (results.length === 0) {
              lines.push('No stalled issues matched the current filters.');
            } else {
              for (const row of results) {
                lines.push(`- #${row.number} [${row.stageLabel}] ${row.status} | stage-age=${row.stageAgeHours}h | updated=${row.updatedHours}h :: ${row.title}`);
              }
            }

            core.summary.addHeading('RW Stalled Stage Detector').addCodeBlock(lines.join('\n')).write();
