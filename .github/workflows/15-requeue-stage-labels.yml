name: "RW: Requeue Stage Labels"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no label changes)"
        required: true
        default: true
        type: boolean
      max_issues:
        description: "Max issues to requeue"
        required: true
        default: "25"
      stage_filter:
        description: "Optional exact stage label (e.g. stage/0-intake)"
        required: true
        default: "stage/0-intake"
        type: choice
        options:
          - "stage/0-intake"
          - "stage/1-normalized"
          - "stage/2-deduped"
          - "stage/3-scored"
          - "stage/4-solution"
          - "stage/ai-defensibility"
          - "stage/5-competitors"
          - "stage/6-shortlist"
          - "stage/7-validation"
  # schedule:
  #   - cron: "17 */4 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: rw-requeue-stage-labels
  cancel-in-progress: false

jobs:
  requeue:
    runs-on: ubuntu-latest
    steps:
      - name: Requeue eligible issues by toggling current stage label
        uses: actions/github-script@v8
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INPUT_MAX_ISSUES: ${{ inputs.max_issues || '25' }}
          INPUT_STAGE_FILTER: ${{ inputs.stage_filter || '' }}
          SAFEOUTPUTS_TOKEN_PRESENT: ${{ secrets.SAFEOUTPUTS_GITHUB_TOKEN != '' }}
        with:
          github-token: ${{ secrets.SAFEOUTPUTS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = String(process.env.INPUT_DRY_RUN).toLowerCase() === 'true';
            const maxIssues = Number.parseInt(process.env.INPUT_MAX_ISSUES || '25', 10);
            const stageFilter = (process.env.INPUT_STAGE_FILTER || '').trim();
            const safeTokenPresent = String(process.env.SAFEOUTPUTS_TOKEN_PRESENT).toLowerCase() === 'true';

            if (!dryRun && !safeTokenPresent) {
              core.setFailed('SAFEOUTPUTS_GITHUB_TOKEN is required for non-dry-run mode to reliably trigger downstream workflows.');
              return;
            }

            const stageLabelPattern = /^stage\/\d+-/;
            const ignoredLabels = ['agentic-workflows', 'rw/processing'];
            const experimentLabel = 'type/experiment';

            async function hasExperimentSubIssue(issueNumber) {
              let subPage = 1;
              while (subPage <= 10) {
                let response;
                try {
                  response = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                    owner,
                    repo,
                    issue_number: issueNumber,
                    per_page: 100,
                    page: subPage
                  });
                } catch (error) {
                  if (error.status === 404 || error.status === 410 || error.status === 422) {
                    return false;
                  }
                  throw error;
                }

                const subIssues = Array.isArray(response.data)
                  ? response.data
                  : Array.isArray(response.data?.sub_issues)
                    ? response.data.sub_issues
                    : [];

                if (subIssues.length === 0) return false;

                for (const subIssue of subIssues) {
                  const labels = (subIssue.labels || [])
                    .map((label) => typeof label === 'string' ? label : label?.name)
                    .filter(Boolean);
                  const subIssueState = String(subIssue.state || '').toLowerCase();
                  if (labels.includes(experimentLabel) && subIssueState !== 'closed') return true;
                }

                if (subIssues.length < 100) return false;
                subPage += 1;
              }

              return false;
            }

            let skippedWithExperimentSubIssue = 0;

            const candidates = [];
            let page = 1;
            while (page <= 10) {
              const response = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: 'type/problem',
                per_page: 100,
                page
              });

              const issues = response.data.filter((item) => !item.pull_request);
              if (issues.length === 0) break;

              for (const issue of issues) {
                const labels = issue.labels.map((l) => typeof l === 'string' ? l : l.name).filter(Boolean);
                if (ignoredLabels.some(label => labels.includes(label))) continue;

                const stageLabels = labels.filter((label) => stageLabelPattern.test(label));
                if (stageLabels.length !== 1) continue;

                const stageLabel = stageLabels[0];
                if (stageLabel === 'stage/9-archived') continue;
                if (stageFilter && stageLabel !== stageFilter) continue;

                if (await hasExperimentSubIssue(issue.number)) {
                  skippedWithExperimentSubIssue += 1;
                  continue;
                }

                candidates.push({ number: issue.number, title: issue.title, stageLabel });
                if (candidates.length >= maxIssues) break;
              }

              if (candidates.length >= maxIssues) break;
              page += 1;
            }

            core.info(`Found ${candidates.length} eligible issue(s). dry_run=${dryRun}`);

            const results = [];
            for (const item of candidates) {
              if (dryRun) {
                results.push({ ...item, status: 'preview' });
                continue;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: item.number,
                  name: item.stageLabel
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: item.number,
                labels: [item.stageLabel]
              });

              results.push({ ...item, status: 'requeued' });
            }

            const lines = [
              `Mode: ${dryRun ? 'dry-run' : 'apply'}`,
              `Eligible issues: ${candidates.length}`,
              `Skipped (has sub-issue with ${experimentLabel}): ${skippedWithExperimentSubIssue}`,
              ''
            ];

            if (results.length === 0) {
              lines.push('No issues matched current filters.');
            } else {
              for (const row of results) {
                lines.push(`- #${row.number} [${row.stageLabel}] ${row.status} :: ${row.title}`);
              }
            }

            core.summary.addHeading('RW Requeue Stage Labels').addCodeBlock(lines.join('\n')).write();
