name: "RW: Reset Problems To Intake (Script)"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "single_issue = only that issue; range_of_issues = qualifying issues in [lower_issue_id..issue_id]"
        required: true
        default: range_of_issues
        type: choice
        options:
          - single_issue
          - range_of_issues
      issue_id:
        description: "Issue number, or upper boundary issue number when mode=range_of_issues (inclusive)"
        required: true
        type: number
      lower_issue_id:
        description: "Lower boundary issue number when mode=range_of_issues (inclusive), relevant only when mode=range_of_issues"
        required: true
        default: 1
        type: number

concurrency:
  group: rw-reset-to-intake-backfill
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reset qualifying issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESET_MODE: ${{ inputs.mode }}
          LOWER_ISSUE_ID: ${{ inputs.lower_issue_id }}
          TARGET_ISSUE_ID: ${{ inputs.issue_id }}
        run: python .github/scripts/reset_to_intake.py