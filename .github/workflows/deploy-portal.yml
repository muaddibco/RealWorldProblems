name: Deploy Portal to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/src/**'
      - 'api/host.json'
      - 'api/package.json'
      - 'api/tsconfig.json'
      - 'staticwebapp.config.json'
      - 'angular.json'
      - 'package.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy portal + API

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build portal (Angular)
        run: yarn build:portal

      - name: Build API (TypeScript)
        run: yarn api:build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'dist/portal'
          api_location: 'api'
          skip_app_build: true
          skip_api_build: true
